# Standalone overlay-local gate: CARVED TRUE-BASE TWIN for one tail-slot row.
# Provenance: work/tailslot_honest/TWIN_REPORT.md (2026-09-14), the round-25-part-3 rollback
# of four tail-slot rows re-landed as honest goto/return C at their true base.
#
# ROW      func_818FA12C  (foff 0x191A12C, 3388 B, cfg 2.7.2-cdk-G0)
# REGION   config/overlays/dungeon.rowbase.jsonl :: jtbl_191A12C
#          [0x191A12C,0x191AE68) delta 0x7E70B800 -> TRUE BASE 0x8002592C
#          The region extent IS this row's extent, so this window is carved to it exactly:
#          it swallows no foreign row and renames nothing already banked.
# TRUE NAME func_8002592C  (register it in ledger/splits/dungeon.jsonl; see TWIN_REPORT.md S6)
#
# WHY A TWIN. Its seed dungeon_deep_t8b_1919b98 (0x1919B98-0x191AE68,
# vram 0x818F9B98) is a SYNTHETIC-base window and stays live: 3 sibling row(s)
# (func_818F9B98, func_818F9D8C, func_818F9E48) still name it as their window of record, so
# gate_all.superseded() keeps it. This twin therefore does NOT replace the seed — it is the
# window of record for THIS row, the one window whose declared vram_start equals the base the
# row actually links at. Its stem is the row's own file offset (not the seed's), exactly like the
# landed carved twins dungeon_deep_18b88cc_truebase_800240cc and
# dungeon_deep_1931bf4_truebase_800253f4, so superseded() never considers dropping the seed.
#
# WHAT ACTUALLY FIXES THE LINK — read this before applying (TWIN_REPORT.md S3).
# The failure this row was rolled back for is NOT a window property and no yaml field cures it:
#   `.rodata' referenced in section `.text.func_818FA12C' of obj/func_8002592C.o:
#   defined in discarded section `.rodata'
# Once the region is proven, overlay_local_gate.load_matches() sets the segment's func to the
# TRUE name, and the rowbase mini-link calls match._local_section_placements(obj, "func_8002592C",
# ...). That derivation starts with symbol_info(obj, target); the honest candidate still DEFINES
# func_818FA12C, so the lookup misses, the derivation returns {}, no
# "`.rodata` 0x... (NOLOAD)" line is emitted, and the switch table falls into the linker script's
# unconditional /DISCARD/. The cure is in the SOURCE: spell the definition func_8002592C
# (the shape every landed proven-region source already has — src/dungeon/func_81911BF4.c defines
# func_800253F4, src/dungeon/func_80AEB3AC.c defines func_8014EBAC). MEASURED 2026-09-14:
# with the definition renamed, the placement derives `.rodata 0x80024038` and the mini-link is
# byte-exact, 847/847 words, at 0x8002592C.
#
# BASE CONFIDENCE. proven-rowbase: by the time this window is live the region record reads
# base_confidence "proven" (rowbase.py promote runs first). "jump-implied" is what
# tools/dungeon_image_windows.py writes for a statically j-solved IMAGE window with no rowbase
# record behind it (config/overlays/dungeon_deep_00d54c_truebase_8008acac.overlay.yaml); it would
# understate a region that a discriminating byte-exact recompile has promoted. The field is
# documentary either way — overlay_local_gate.py reads only file_start / file_end / vram_start.
#
# Do NOT add to configure.py / build.ninja; run via tools/gate/overlay_local_gate.py --clean.
name: dungeon_deep_191a12c_truebase_8002592c

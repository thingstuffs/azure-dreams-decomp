# Standalone overlay-local gate seed -- DEEP/BACK-HALF town subwindow (T8 gate-expansion batch, second wave / t8b).
# Do NOT add to configure.py / build.ninja; run via tools/overlay_local_gate.py --clean.
#
# Gives a gate_config to 1 banked byte-verified reconcile-lane match(es) (permuter
# frontier, result==NOMATCH in the split JSON, verified via the attempts journal, not yet
# integrated) that previously had NO gate window, so overlay_reconcile_lane can freeze +
# land them (and the growing blitz stream in this file region):
#   func_808834DC
#
# BASE NOTE -- base_confidence: synthetic-self-consistent (NOT proven).
# This region has NEITHER a runtime RAM-capture base (the T8 RAM dumps proved only the town-scene K=0x8007D760 at file 0xB000-0x7F166; this file region is past that proven extent) NOR a static jr-table
# proof (work/overlay_recon/loadmap_town.json carries one proven band, 0x272F8-0x43368 (town scene, delta -0x28A0 -> K=0x8007D760); this region is an
# unresolved/insufficient jr-switch site -- deep/back-half scenes make ~0 intra-region
# calls, so the v3 call-graph/jtbl K-test does not reach a consensus delta). Per
# docs/gate_expansion_notes.md the window therefore uses the synthetic self-consistent
# sweep base  vram = file + 0x80080000  -- the SAME base these matches were byte-verified
# under and that the landed town corpus lives in. The byte gate is blind to a uniform
# base (an all-raw window is byte-identical at any base), so landing here is byte-SOUND;
# the base label stays honest until a dungeon/boss RAM dump or a local jr-table proof
# upgrades it. Refs: docs/gate_expansion_notes.md; work/t8/T8_FINDINGS.md.
# Expected first state: targets are result==NOMATCH -> all-raw window == container bytes.
name: town_deep_t8b_0803
sha1: b946a57aa5fc8cec29db3ecabad6e6b76df418b7
options:
  basename: town_deep_t8b_0803
  target_path: work/s3_splat/extract/TOWN_TOWN.BIN
  base_path: ..
  platform: psx
  compiler: GCC
  subalign: 4
  find_file_boundaries: False
  gp_value: 0x80080994
standalone_build:
  work_dir: work/s3_splat
  extract:
    extractor: work/overlay_recon/extract_bins.py
    disc_path: "bin/Azure Dreams.bin"
    out_dir: work/s3_splat/extract
    container_path: work/s3_splat/extract/TOWN_TOWN.BIN
  window:
    file_start: 0x8034DC
    file_end: 0x803524
    vram_start: 0x808834DC          # = 0x8034DC + 0x80080000 (synthetic sweep base)
    base_confidence: synthetic-self-consistent   # NOT proven; see BASE NOTE
  split_results: overlays/town/overlay_first_pass_results.json
  matched_sources:
    - name: overlays/town
      results: overlays/town/overlay_first_pass_results.json
      source_dir: overlays/town/first_pass_matched
      skip_rerun: true
segments:
  - [0x0, bin]
  - type: code
    start: 0x8034DC
    vram: 0x808834DC
    subsegments:
      - [0x8034DC, asm]
  - [0x803524, bin]
  - [0x101B800]

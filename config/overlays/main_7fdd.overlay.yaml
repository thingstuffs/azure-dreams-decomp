# Standalone overlay-local build seed for the MAIN 0x7FDD VRAM subwindow.
# Do NOT add to configure.py / build.ninja; use tools/overlay_local_gate.py for
# the isolated MAIN 7FDD overlay gate.
#
# MAIN.BIN carries a second overlay loaded at 0x7FDD0000, distinct from the
# boot/menu window (0x8000xxxx) covered by main_boot.overlay.yaml.
# DERIVED load map: vram = file_offset + 0x7FDB0000
#   file 0x20000 -> vram 0x7FDD0000, matching the func_7FDDxxxx split rows in
#   overlays/main/overlay_first_pass_results.json (vram < 0x80000000).
name: main_7fdd
sha1: 69f63236b7ab2260e2e9aa2048ce7aa540bdbe6d
options:
  basename: main_7fdd
  target_path: work/roundtrip/extract/MAIN/MAIN.BIN
  base_path: ..
  platform: psx
  compiler: GCC
  subalign: 4
  find_file_boundaries: False
  gp_value: 0x80080994
standalone_build:
  work_dir: work/s3_splat
  extract:
    extractor: work/overlay_recon/extract_bins.py
    disc_path: "bin/Azure Dreams.bin"
    out_dir: work/s3_splat/extract
    container_path: work/roundtrip/extract/MAIN/MAIN.BIN
  window:
    file_start: 0x20000
    file_end: 0x25000
    vram_start: 0x7FDD0000
    base_confidence: derived
  split_results: overlays/main/overlay_first_pass_results.json
  matched_sources:
    - name: overlays/main
      results: overlays/main/overlay_first_pass_results.json
      source_dir: overlays/main/first_pass_matched
      skip_rerun: true
segments:
  - [0x0, bin]
  - type: code
    start: 0x20000
    vram: 0x7FDD0000
    subsegments:
      - [0x20000, asm]
  - [0x25000, bin]
  - [0x275800]

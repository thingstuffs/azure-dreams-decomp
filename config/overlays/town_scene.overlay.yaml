# DRAFT — not wired into build (Task T7 overlay inventory).
# Do NOT add to configure.py / build.ninja. Starting point for Phase-B splitting.
#
# First town/scene overlay, carved from TOWN/TOWN.BIN.
# PROVEN load map: vram = file_offset + 0x80080000  (file 0x0 -> vram 0x80080000).
#   objdump at file 0x20000 -> vram 0x800A0000 is coherent code; internal jal targets track
#   file offset 1:1 (file 0x10000->0x80090000 (925 jals), 0x20000->0x800A0000, 0x30000->0x800B0000,
#   0x40000->0x800C0000). Code proper begins ~file 0xD544 (vram 0x8008D544); the 0x0..0xD544
#   lead-in is the shared KDT sound bank + assets that load to 0x80080000 with the overlay.
# Upper bound (~file 0x52000 / vram 0x800D2000) is APPROXIMATE — refine after T8 RAM capture.
# Shares its 0x80080000 base with the dungeon engine overlay (mutually exclusive scenes).
name: town_scene
sha1: b946a57aa5fc8cec29db3ecabad6e6b76df418b7   # TOWN.BIN
options:
  basename: town_scene
  target_path: work/s3_splat/extract/TOWN_TOWN.BIN
  base_path: ..
  platform: psx
  compiler: GCC
  subalign: 4
  find_file_boundaries: False
  gp_value: 0x80080994
standalone_build:
  work_dir: work/s3_splat
  extract:
    extractor: work/overlay_recon/extract_bins.py
    disc_path: "bin/Azure Dreams.bin"
    out_dir: work/s3_splat/extract
    container_path: work/s3_splat/extract/TOWN_TOWN.BIN
  window:
    file_start: 0x0
    file_end: 0x52000
    vram_start: 0x80080000
    base_confidence: proven
  split_results: overlays/town/overlay_first_pass_results.json
  matched_sources:
    - name: overlays/town
      results: overlays/town/overlay_first_pass_results.json
      source_dir: overlays/town/first_pass_matched
      skip_rerun: true
segments:
  - type: code
    start: 0x0
    vram: 0x80080000
    subsegments:
      - [0x0, bin]              # KDT sound bank + assets lead-in (to ~0xD544)
      - [0xD544, asm]           # .text
  # rest of TOWN.BIN = further per-map/shop overlays + assets (many; not carved here)
  - [0x52000, bin]
  - [0x101b800]                 # EOF (TOWN.BIN size)

# Standalone overlay-local gate seed -- DEEP/BACK-HALF town subwindow (T8 gate-expansion, zq finisher).
# Do NOT add to configure.py / build.ninja; run via tools/overlay_local_gate.py --clean.
#
# Gives a gate_config to permuter/idiom-knob byte-verified match(es) that previously had NO
# gate window (result==NOMATCH in the split JSON, closed by mutation/knob search), so they can be landed:
#   func_8051E9F4
#
# BASE NOTE -- base_confidence: synthetic-self-consistent (NOT proven).
# This region has NEITHER a runtime RAM-capture base (the T8 RAM dumps proved only the town-scene K=0x8007D760 at file 0xB000-0x7F166; this file region is past that proven extent) NOR a static jr-table proof (work/overlay_recon/loadmap_town.json carries one proven band, 0x272F8-0x43368). Per docs/gate_expansion_notes.md the window uses the synthetic self-consistent sweep base vram = file + 0x80080000.
# The byte gate is blind to a uniform base (an all-raw window is byte-identical at any base), so landing
# here is byte-SOUND; the base label stays honest until a RAM dump or local jr-table proof upgrades it.
# Refs: docs/gate_expansion_notes.md; work/t8/T8_FINDINGS.md. vram_start is the func_ naming base only
# (chain-G trap b4ae80e) -- no proven load base here, so no true_vram_start.
# Expected first state: targets are result==NOMATCH -> all-raw window == container bytes.
